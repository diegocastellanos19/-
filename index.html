<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para ti, en el Día de las Flores Amarillas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="stage">
  <div id="stars">
    <div class="star-layer" id="star-layer-1"></div>
    <div class="star-layer" id="star-layer-2"></div>
    <div class="shooting-star" style="top:18%; right:8%;"></div>
    <div class="shooting-star" style="top:34%; right:30%; animation-delay: 3.4s;"></div>
  </div>
  <div class="nebula n1"></div>
  <div class="nebula n2"></div>
  <div class="nebula n3"></div>
  <div id="petals"></div>
  <div class="vignette"></div>

  <!-- Pantalla inicial -->
  <div id="intro">
    <div class="bouquet-mark" id="bouquet-mark"></div>
    <div class="tap-label">No sera espectadora(precione la pantalla)</div>
  </div>

  <button id="sound-toggle" aria-label="Silenciar música" title="Música">♪</button>

  <!-- Escena principal -->
  <div id="scene">
    <h1 id="nombre-titulo">Feliz dia de las flores amarrillas</h1>
    <p class="subline">una pequeña galaxia para ti</p>

    <div class="orbit-wrap">
      <div class="orbit-ring"></div>
      <div class="planet-wrap">
        <div class="planet-glow"></div>
        <div class="planet-ring back"></div>
        <div class="planet"></div>
        <div class="planet-ring front"></div>
        <div class="flower-orbit" aria-hidden="true">
          <div class="flower-orbit-path"></div>
          <div class="orbit-flower flower-1"></div>
          <div class="orbit-flower flower-2"></div>
          <div class="orbit-flower flower-3"></div>
          <div class="orbit-flower flower-4"></div>
          <div class="orbit-flower flower-5"></div>
          <div class="orbit-flower flower-6"></div>
        </div>
      </div>
      <div class="photo-orbit">
        <!--
          ===== CÍRCULOS EN EL ANILLO =====
          4 círculos con flor amarilla + 2 círculos para fotos.
          Para poner una foto, guarda foto5.jpg / foto6.jpg en la
          carpeta fotos (los círculos se ocultan si no existen).
        -->
        <div class="photo p1"></div>

        <div class="photo p2"></div>

        <div class="photo p3"></div>

        <div class="photo p4"></div>

        <div class="photo p5">
          <img src="C:\Users\MINEDUCYT\Downloads\FloresAmarilas\proyecto_flores_amarillas\fotos\WhatsApp Image 2026-09-21 at 3.53.14 PM.jpeg" alt="Foto 5" onerror="this.style.display='none'">
          <span></span>
        </div>

        <div class="photo p6">
          <img src="C:\Users\MINEDUCYT\Downloads\FloresAmarilas\proyecto_flores_amarillas\fotos\WhatsApp Image 2026-09-21 at 3.54.39 PM.jpeg" alt="Foto 6" onerror="this.style.display='none'">
          <span></span>
        </div>
      </div>
    </div>

    <p class="message">
      Que este pequeño universo te recuerde cuánto significas
      en mi vida, hoy y siempre.
    </p>
    <p class="signature">Un ramito rosado porque es el que me recuerda a usted💗</p>
    
    <div id="bouquet-final"></div>
    
  </div>
  
  

  <!-- ===== MÚSICA OPCIONAL =====
       Si quieres música:
       1. Pon un archivo llamado musica.mp3 junto a este HTML.
       2. Quita los comentarios de la siguiente línea.
  -->
  <!-- <audio id="bg-music" loop src="musica.mp3"></audio> -->
</div>

<script>
  // ============ CONFIGURA AQUÍ ============
  const NOMBRE  = "Feliz dia de las flores amarrillas";
  const MENSAJE = " Que este pequeño universo te recuerde cuánto significan en mi vida, hoy y siempre.";
  // =========================================

  document.getElementById('nombre-titulo').textContent = NOMBRE;
  document.querySelector('.message').textContent = MENSAJE;

  // ---- Ramo de flores (amarillo para el inicio, rosa para el final) ----
  function makeBouquet(pink){
    const pet = pink
      ? ['#f7a8c4','#ec8fb3','#f8b5ce','#e57fa9','#f9c0d6','#ec92b8','#f8b9d0','#e884ac']
      : ['#f2c65e','#e6ad45','#f4ca68','#dfaa3e','#f5d273','#e6b24c','#f4cb6b','#e2aa40'];
    const centro = pink ? '#a7697f' : '#9a622e';
    const centroOsc = pink ? '#6e4352' : '#6b431f';
    function pimpollo(){
      return `
        <circle cx="0" cy="-18" r="10" fill="${pet[0]}"/>
        <circle cx="11" cy="-14" r="10" fill="${pet[1]}"/>
        <circle cx="18" cy="-3" r="10" fill="${pet[2]}"/>
        <circle cx="14" cy="10" r="10" fill="${pet[3]}"/>
        <circle cx="3" cy="17" r="10" fill="${pet[4]}"/>
        <circle cx="-9" cy="13" r="10" fill="${pet[5]}"/>
        <circle cx="-17" cy="2" r="10" fill="${pet[6]}"/>
        <circle cx="-12" cy="-11" r="10" fill="${pet[7]}"/>
        <circle cx="0" cy="0" r="9" fill="${centro}"/>
        <circle cx="0" cy="0" r="4" fill="${centroOsc}"/>`;
    }
    return `
      <svg viewBox="0 0 150 170" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g class="stems">
          <path class="stem" d="M76 145 C72 125 64 105 48 78"/>
          <path class="stem" d="M76 145 C78 122 86 99 101 74"/>
          <path class="stem" d="M76 145 C75 116 74 91 75 56"/>
          <path class="stem" d="M76 145 C68 126 52 117 36 110"/>
          <path class="stem" d="M76 145 C84 125 98 116 116 106"/>
          <path class="stem" d="M75 145 C75 153 73 158 72 162"/>
        </g>

        <path class="leaf" d="M65 124 C50 116 43 117 35 108 C48 105 59 109 68 119 Z"/>
        <path class="leaf" d="M84 124 C99 116 108 117 117 107 C103 104 92 108 82 119 Z"/>
        <path class="leaf" d="M67 134 C56 129 48 130 41 124 C52 121 61 124 70 130 Z"/>

        <g class="bloom" transform="translate(48 55) scale(.58)">
          ${pimpollo()}
        </g>

        <g class="bloom" transform="translate(101 51) scale(.54)">
          ${pimpollo()}
        </g>

        <g class="bloom" transform="translate(75 37) scale(.70)">
          ${pimpollo()}
        </g>

        <g class="bloom" transform="translate(36 82) scale(.43)">
          ${pimpollo()}
        </g>

        <g class="bloom" transform="translate(115 82) scale(.43)">
          ${pimpollo()}
        </g>
      </svg>`;
  }

  const bouquet = document.getElementById('bouquet-mark');
  if (bouquet) bouquet.innerHTML = makeBouquet();

  const bouquetFinal = document.getElementById('bouquet-final');
  if (bouquetFinal) bouquetFinal.innerHTML = makeBouquet(true);

  // ---- Flor amarilla realista (SVG generado), para fotos y pétalos que caen ----
  let flowerIdCounter = 0;
  function makeFlower(size, rotation){
    const id = flowerIdCounter++;
    const petalAngles = [0,32,64,96,128,160,192,224,256,288,320];
    let backPetals = '', frontPetals = '';
    petalAngles.forEach((a, i) => {
      const long = i % 2 === 0;
      const tipY = long ? 6 : 12;
      backPetals += `<path d="M50 50 C41 34 39 ${tipY+6} 50 ${tipY} C61 ${tipY+6} 59 34 50 50 Z"
        fill="url(#petalGradBack${id})" opacity="0.85" transform="rotate(${a+16} 50 50)"/>`;
      frontPetals += `<path d="M50 50 C43 33 41 ${tipY-2} 50 ${tipY-6} C59 ${tipY-2} 57 33 50 50 Z"
        fill="url(#petalGradFront${id})" transform="rotate(${a} 50 50)"/>`;
    });
    return `
    <svg viewBox="0 0 100 100" width="${size}" height="${size}"
         xmlns="http://www.w3.org/2000/svg" style="transform:rotate(${rotation}deg)">
      <defs>
        <radialGradient id="petalGradBack${id}" cx="50%" cy="92%" r="85%">
          <stop offset="0%" stop-color="#e9b94f"/>
          <stop offset="100%" stop-color="#b9852f"/>
        </radialGradient>
        <radialGradient id="petalGradFront${id}" cx="50%" cy="88%" r="80%">
          <stop offset="0%" stop-color="#fff6da"/>
          <stop offset="45%" stop-color="#f7d573"/>
          <stop offset="100%" stop-color="#e2af49"/>
        </radialGradient>
        <radialGradient id="centerGrad${id}" cx="35%" cy="28%" r="78%">
          <stop offset="0%" stop-color="#c9873b"/>
          <stop offset="55%" stop-color="#8a5a2e"/>
          <stop offset="100%" stop-color="#54341c"/>
        </radialGradient>
      </defs>
      <g>${backPetals}${frontPetals}</g>
      <circle cx="50" cy="50" r="13.5" fill="url(#centerGrad${id})"/>
      <g fill="#3f2712" opacity="0.55">
        <circle cx="45" cy="45" r="1.1"/><circle cx="54" cy="44" r="1"/>
        <circle cx="49" cy="51" r="1.2"/><circle cx="57" cy="52" r="0.9"/>
        <circle cx="44" cy="54" r="1"/><circle cx="52" cy="58" r="1.1"/>
        <circle cx="59" cy="47" r="0.8"/><circle cx="47" cy="58" r="0.9"/>
      </g>
    </svg>`;
  }
  // Flores amarillas en el anillo (en los círculos que no son de foto)
  var floresAnillo = document.querySelectorAll('.photo');
  for (var fi = 0; fi < floresAnillo.length; fi++) {
    if (floresAnillo[fi].querySelector('img')) continue;
    floresAnillo[fi].innerHTML = makeFlower(100, Math.random() * 360);
  }

  // ---- Estrellas de fondo (dos capas, distinto tamaño/velocidad) ----
  function paintStars(container, count, sizeMin, sizeMax, speedMin, speedMax){
    for(let i=0;i<count;i++){
      const s = document.createElement('div');
      s.className = 'star';
      const size = sizeMin + Math.random()*(sizeMax-sizeMin);
      s.style.width = size+'px';
      s.style.height = size+'px';
      s.style.left = Math.random()*100+'%';
      s.style.top = Math.random()*100+'%';
      s.style.animationDuration = (speedMin + Math.random()*(speedMax-speedMin))+'s';
      s.style.animationDelay = (Math.random()*4)+'s';
      container.appendChild(s);
    }
  }
  paintStars(document.getElementById('star-layer-1'), 70, 0.6, 1.4, 2.5, 5);
  paintStars(document.getElementById('star-layer-2'), 40, 1.4, 2.6, 1.8, 3.5);

  // ---- Pétalos amarillos cayendo (SVG, con vaivén) ----
  const petalsEl = document.getElementById('petals');
  const petalCount = 11;
  for(let i=0;i<petalCount;i++){
    const p = document.createElement('div');
    p.className = 'petal';
    const size = 16 + Math.random()*14;
    p.innerHTML = makeFlower(size, Math.random()*360);
    p.style.left = Math.random()*100+'%';
    p.style.animationDuration = (11 + Math.random()*10)+'s';
    p.style.animationDelay = (Math.random()*13)+'s';
    petalsEl.appendChild(p);
  }

  // ---- Toca para iniciar ----
  const intro = document.getElementById('intro');
  const scene = document.getElementById('scene');
  const music = document.getElementById('bg-music');
  if (intro) {
    intro.addEventListener('click', () => {
      intro.classList.add('hidden');
      setTimeout(() => {
        if (scene) scene.classList.add('visible');
      }, 250);
      if(music){ music.play().catch(()=>{}); }
    }, { once: true });
  }

  // ---- Silenciar / activar música ----
  const soundBtn = document.getElementById('sound-toggle');
  if (soundBtn) {
    soundBtn.addEventListener('click', (event) => {
      event.stopPropagation();
      if(!music) return;
      music.muted = !music.muted;
      soundBtn.textContent = music.muted ? '✕' : '♪';
    });
  }
</script>

</body>
</html>
